# Reverse proxy HTTP verso uvicorn (porta locale 8420).
#
# NOTA: questo vhost usa HTTP (porta 80) in attesa del certificato SSL aziendale.
# Quando il certificato sarà disponibile:
#   1. Ripristinare il vhost :80 come redirect → HTTPS
#   2. Rimuovere i commenti dal vhost :443 e configurare i path del certificato
#
# ProxyTimeout 300 è necessario per tool di scan su file grandi (scan_alert_log
# può impiegare fino a 30s su file >300 MB senza pre-filtraggio).

<VirtualHost *:80>
    ServerName neural-mcp-oracle.servizi.gr-u.it

    # Reverse proxy verso uvicorn (porta locale 8420)
    ProxyPreserveHost On
    ProxyRequests     Off

    ProxyPass        / http://127.0.0.1:8420/
    ProxyPassReverse / http://127.0.0.1:8420/

    # Timeout esplicito per tool di scan su file grandi (es. scan_alert_log)
    ProxyTimeout 300

    # Passa gli header originali al backend
    RequestHeader set X-Forwarded-Proto "http"
    RequestHeader set X-Forwarded-Host  "%{HTTP_HOST}e"

    # Log separati per questo vhost
    ErrorLog  /var/log/httpd/neural-mcp-oracle-error.log
    CustomLog /var/log/httpd/neural-mcp-oracle-access.log combined
</VirtualHost>

# Vhost HTTPS — placeholder per quando sarà disponibile il certificato SSL aziendale.
