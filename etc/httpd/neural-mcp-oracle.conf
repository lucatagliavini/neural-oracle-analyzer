<VirtualHost *:80>
    ServerName neural-mcp-oracle.servizi.gr-u.it

    # Redirect tutto il traffico HTTP → HTTPS
    RewriteEngine On
    RewriteRule ^(.*)$ https://%{HTTP_HOST}$1 [R=301,L]
</VirtualHost>

<VirtualHost *:443>
    ServerName neural-mcp-oracle.servizi.gr-u.it

    # TLS — inserire i path reali del certificato aziendale
    SSLEngine on
    # SSLCertificateFile    /etc/pki/tls/certs/neural-mcp-oracle.crt
    # SSLCertificateKeyFile /etc/pki/tls/private/neural-mcp-oracle.key
    # SSLCertificateChainFile /etc/pki/tls/certs/ca-chain.crt

    # Reverse proxy verso uvicorn (porta locale 8420)
    ProxyPreserveHost On
    ProxyRequests     Off

    ProxyPass        / http://127.0.0.1:8420/
    ProxyPassReverse / http://127.0.0.1:8420/

    # Passa gli header originali al backend
    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Forwarded-Host  "%{HTTP_HOST}e"

    # Log separati per questo vhost
    ErrorLog  /var/log/httpd/neural-mcp-oracle-error.log
    CustomLog /var/log/httpd/neural-mcp-oracle-access.log combined
</VirtualHost>
